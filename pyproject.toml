[dependency-groups]
dev = [
  "Werkzeug",
  "django-debug-toolbar<6",
  "django-extensions",
  "watchdog",
  { include-group = "lint" },
  { include-group = "prod" },
]
lint = [
  "bandit",
  "black",
  "isort",
  "mypy",
  "ruff",
  "tombi; python_version>='3.10'",
  "ty",
  "yamllint",
]
prod = [
  "Werkzeug",
  "bs4",
  "celery>=5,<6",
  "django>=4,<5",
  "django-celery-beat",
  "django-cors-headers",
  "django-debug-toolbar>=4,<5",
  "django-extensions",
  "django-redis",
  "gunicorn",
  "mysqlclient",
  "python-decouple",
  "redis",
  "requests",
  "sentry-sdk",
  "statsd",
  "watchdog",
]

# Bandit
# https://bandit.readthedocs.io/en/latest/config.html
[tool.bandit]
exclude_dirs = ["venv"]

# Black
# https://black.readthedocs.io/en/stable/usage_and_configuration/
[tool.black]
line-length = 119
extend-exclude = '(migrations|templates|\.github)'

# Coverage
# https://coverage.readthedocs.io/en/latest/
[tool.coverage.run]
omit = ["venv/*", "migrations/*", "node_modules/*"]

# Isort
# https://pycqa.github.io/isort/docs/configuration/options.html
[tool.isort]
profile = "black"
lines_after_imports = 2
src_paths = ["app"]
skip = ["venv", "migrations", "node_modules", ".github"]

# Mypy
# https://mypy.readthedocs.io/en/stable/config_file.html
[tool.mypy]
ignore_missing_imports = true
exclude = ["venv", "migrations", "node_modules"]

# Ruff
# https://docs.astral.sh/ruff/configuration/
[tool.ruff]
line-length = 119
target-version = "py311"
extend-exclude = ["migrations", "templates", ".github"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "Q"]

# Scripts
# https://github.com/cssnr/toml-run
[tool.scripts]
format = """
black .
isort -c .
ruff format
tombi format .
which prettier && prettier --write . || echo missing prettier
"""
lint = """
run bandit
run mypy
run ruff
run validate
run yamllint
which prettier && prettier --check . || echo missing prettier
black --check .
isort -c .
tombi lint .
ty check -v .
uv lock --check
"""
bandit = "bandit -c pyproject.toml -r ."
mypy = "mypy ."
ruff = "ruff check ."
validate = "validate-pyproject pyproject.toml"
yamllint = "yamllint -c .github/yamllint.yaml ."
